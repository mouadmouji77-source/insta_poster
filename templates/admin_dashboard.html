{% extends 'base.html' %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Admin Dashboard</h1>
    <a href="{% url 'create_user' %}" class="btn btn-success mb-3">Create New User</a>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
            <tr>
                <th>Username</th>
                <th>Instagram Page ID</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.instagram_page_id }}</td>
                <td>
                    <a href="{% url 'update_user' user.pk %}" class="btn btn-warning btn-sm">Update</a>
                    <form method="post" action="{% url 'delete_user' user.pk %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
