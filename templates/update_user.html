{% extends 'base.html' %}

{% block title %}Update User{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4" style="
        color: #405DE6; /* Bleu Instagram */
        font-size: 2rem;
        font-weight: 600;
    ">Update User</h1>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-light">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary btn-lg mt-3">Update User</button>
                    </form>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-lg mt-3">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

<style>
    /* Card styling */
    .card {
        border-radius: 0.75rem;
        background-color: #ffffff;
    }

    .card-body {
        padding: 2rem;
    }

    /* Form styling */
    form {
        margin-bottom: 1rem;
    }

    .form-control {
        border-radius: 0.5rem;
        border: 1px solid #ced4da;
        box-shadow: none;
    }

    .form-control:focus {
        border-color: #405DE6;
        /* Bleu Instagram */
        box-shadow: 0 0 0 0.2rem rgba(64, 93, 230, 0.25);
    }

    /* Buttons */
    .btn-primary {
        background-color: #405DE6;
        /* Bleu Instagram */
        border-color: #405DE6;
        /* Bleu Instagram */
    }

    .btn-primary:hover {
        background-color: #354B8A;
        /* Une teinte plus foncée pour le survol */
        border-color: #354B8A;
        /* Une teinte plus foncée pour le survol */
    }

    .btn-secondary {
        background-color: #f0f0f0;
        border-color: #ccc;
        color: #333;
    }

    .btn-secondary:hover {
        background-color: #e0e0e0;
        border-color: #bbb;
    }

    /* Additional styles */
    .container {
        max-width: 800px;
    }
</style>
