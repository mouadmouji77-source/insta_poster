{% extends 'base.html' %}

{% block title %}Create User{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Create New User</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-lg mt-3">Create User</button>
    </form>
    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-lg mt-3">Back to Dashboard</a>
</div>
{% endblock %}
